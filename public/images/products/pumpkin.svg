<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="pumpkinRind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ashGourdGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="30%" stop-color="#d1fae5"/>
      <stop offset="70%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="pumpkinShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGradP)"/>
  
  <circle cx="200" cy="150" r="115" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25"/>

  <!-- Shadow below pumpkin -->
  <ellipse cx="200" cy="246" rx="110" ry="20" fill="#92400e" opacity="0.22" filter="url(#pumpkinShadow)"/>

  <!-- Pumpkin Ribs / Segments (Rich golden & ash gourd profile) -->
  <g filter="url(#pumpkinShadow)">
    <!-- Back lobes -->
    <ellipse cx="130" cy="165" rx="50" ry="70" fill="#b45309" opacity="0.75"/>
    <ellipse cx="270" cy="165" rx="50" ry="70" fill="#b45309" opacity="0.75"/>

    <!-- Mid lobes -->
    <ellipse cx="150" cy="168" rx="52" ry="74" fill="url(#pumpkinRind)"/>
    <ellipse cx="250" cy="168" rx="52" ry="74" fill="url(#pumpkinRind)"/>

    <!-- Center lobes -->
    <ellipse cx="178" cy="172" rx="46" ry="76" fill="#f59e0b"/>
    <ellipse cx="222" cy="172" rx="46" ry="76" fill="#f59e0b"/>
    <ellipse cx="200" cy="174" rx="42" ry="77" fill="#fbbf24"/>

    <!-- Lobe highlight lines & ribs definition -->
    <path d="M 200 98 Q 155 170 200 249" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.45"/>
    <path d="M 200 98 Q 125 170 170 248" stroke="#92400e" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M 200 98 Q 245 170 200 249" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.45"/>
    <path d="M 200 98 Q 275 170 230 248" stroke="#92400e" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Highlight sheen -->
    <ellipse cx="185" cy="145" rx="18" ry="40" transform="rotate(-15 185 145)" fill="#ffffff" opacity="0.32"/>

    <!-- Stem on top -->
    <path d="M 194 102 C 190 75, 215 65, 210 50 C 205 50, 196 68, 190 98 Z" fill="url(#stemGrad)"/>
    <path d="M 192 100 Q 204 78 206 52" stroke="#65a30d" stroke-width="2" fill="none"/>
  </g>

  <!-- Farm Fresh Badge -->
  <g transform="translate(24, 24)">
    <rect width="115" height="28" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#d97706"/>
    <text x="28" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">MULTI-TONNE</text>
  </g>

  <!-- Regional Tag -->
  <g transform="translate(270, 248)">
    <rect width="105" height="28" rx="8" fill="#b45309" fill-opacity="0.95"/>
    <text x="52" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">பூசணிக்காய்</text>
  </g>
</svg>