<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="bananaGreen1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bananaGreen2" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="bananaShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGradB)"/>
  
  <circle cx="200" cy="150" r="110" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25"/>

  <!-- Shadow beneath bunch -->
  <ellipse cx="205" cy="245" rx="125" ry="18" fill="#065f46" opacity="0.2" filter="url(#bananaShadow)"/>

  <!-- Banana 1 (Bottom curve) -->
  <g filter="url(#bananaShadow)">
    <path d="M 100 135 C 130 200, 240 235, 310 185 C 316 181, 312 170, 305 174 C 235 215, 145 185, 115 130 C 110 125, 96 128, 100 135 Z" fill="url(#bananaGreen1)"/>
    <!-- Ridge on raw banana finger -->
    <path d="M 112 135 C 142 195, 238 220, 305 178" stroke="#86efac" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Banana 2 (Center prominent raw banana) -->
  <g filter="url(#bananaShadow)">
    <path d="M 85 110 C 120 185, 250 220, 325 155 C 332 150, 326 138, 318 142 C 245 198, 135 168, 102 105 C 96 98, 80 102, 85 110 Z" fill="url(#bananaGreen2)"/>
    <path d="M 98 108 C 132 175, 248 202, 318 147" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 104 118 C 140 182, 242 208, 312 154" stroke="#14532d" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Banana 3 (Top arch) -->
  <g filter="url(#bananaShadow)">
    <path d="M 92 88 C 135 150, 240 178, 305 125 C 312 120, 306 110, 298 114 C 238 160, 145 135, 108 82 C 102 75, 87 80, 92 88 Z" fill="url(#bananaGreen1)"/>
    <path d="M 104 86 C 142 140, 236 162, 298 118" stroke="#86efac" stroke-width="2.5" fill="none" opacity="0.65"/>
  </g>

  <!-- Crown / Stem bunch joiner -->
  <path d="M 85 100 C 80 92, 70 95, 68 110 C 66 122, 78 135, 92 128 C 98 122, 95 108, 85 100 Z" fill="#14532d"/>
  <circle cx="76" cy="112" r="6" fill="#3f6212"/>

  <!-- Banana Tips (black crown tips typical of plantains) -->
  <circle cx="310" cy="182" r="3.5" fill="#14532d"/>
  <circle cx="323" cy="151" r="3.5" fill="#14532d"/>
  <circle cx="304" cy="122" r="3" fill="#14532d"/>

  <!-- Farm Fresh Badge -->
  <g transform="translate(24, 24)">
    <rect width="115" height="28" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#16a34a"/>
    <text x="28" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">GRADE-A FIRM</text>
  </g>

  <!-- Regional Tag -->
  <g transform="translate(270, 248)">
    <rect width="105" height="28" rx="8" fill="#15803d" fill-opacity="0.95"/>
    <text x="52" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">வாழைக்காய்</text>
  </g>
</svg>